<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F3F0EA" />
<meta name="description" content="Shlokas for Samaya. One shloka at a time, in Amma's voice." />
<meta name="apple-mobile-web-app-title" content="Shlokas" />
<title>Shlokas for Samaya</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%238A5A2B' width='16' height='16' rx='3'/%3E%3C/svg%3E" />
<link rel="preload" href="fonts/NotoSans.ttf" as="font" type="font/ttf" crossorigin />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app" id="app">
    <main class="views" id="views"></main>
  </div>

  <div class="picker" id="whole" hidden>
    <button class="picker-backdrop" type="button" data-close aria-label="Close the whole shloka"></button>
    <div class="picker-sheet" role="dialog" aria-modal="true" aria-labelledby="wholeTitle">
      <div class="grab" aria-hidden="true"></div>
      <div class="sheet-head">
        <div>
          <p class="eyebrow">All the lines</p>
          <h2 class="title" id="wholeTitle">Whole shloka</h2>
        </div>
        <button class="close" type="button" data-close>Close</button>
      </div>
      <div id="wholeBody"></div>
      <p class="note" data-missing hidden><svg class="ic" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="#6A625B" stroke-width="1.5"/><path d="M8 4.8v3.6l2.2 1.3" stroke="#6A625B" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>Not recorded yet. Record it once in Voice Memos and it plays here.</p>
      <button class="btn btn-play is-dim" type="button" data-audio="voice" id="sheetVoice" disabled>
        <span class="disc" aria-hidden="true">
          <svg class="icon-play" width="16" height="16" viewBox="0 0 16 16"><path d="M4 2.5v11l9.5-5.5z" fill="currentColor"/></svg>
          <svg class="icon-pause" width="16" height="16" viewBox="0 0 16 16"><rect x="3.2" y="2.6" width="3.1" height="10.8" rx="0.8" fill="currentColor"/><rect x="9.7" y="2.6" width="3.1" height="10.8" rx="0.8" fill="currentColor"/></svg>
        </span>
        <span data-voice-label>Play Amma's voice</span>
      </button>
    </div>
  </div>

  <div class="picker" id="all" hidden>
    <button class="picker-backdrop" type="button" data-close aria-label="Close the shloka list"></button>
    <div class="picker-sheet" role="dialog" aria-modal="true" aria-labelledby="allTitle">
      <div class="grab" aria-hidden="true"></div>
      <div class="sheet-head">
        <div>
          <p class="eyebrow">Look at one</p>
          <h2 class="title" id="allTitle">All 3 shlokas</h2>
        </div>
        <button class="close" type="button" data-close>Close</button>
      </div>
      <div class="picker-list" id="allBody"></div>
    </div>
  </div>

  <noscript class="noscript">Shlokas for Samaya needs JavaScript to turn the pages. The shlokas are still yours to chant.</noscript>
  <script src="js/app.js"></script>
</body>
</html>
